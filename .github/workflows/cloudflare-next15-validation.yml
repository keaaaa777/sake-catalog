name: Cloudflare Next.js 15 isolated validation

on:
  push:
    branches:
      - cloudflare-next15-opennext-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-next15-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-next15-opennext-validation
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Report current baseline
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          node -e "const p=require('./package.json'); console.log(JSON.stringify({next:p.dependencies?.next,react:p.dependencies?.react,reactDom:p.dependencies?.['react-dom']},null,2))"

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Run current quality checks
        run: npm run quality

      - name: Run current Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://sake-catalog-preview.invalid
          SITEMAP_PHASE: "1"

      # Intentionally no Cloudflare credentials, preview command, deploy command,
      # package upgrades, codemods, or repository writes in this baseline workflow.
