name: Cloudflare Next.js 15 OpenNext build validation

on:
  push:
    branches:
      - cloudflare-next15-opennext-validation
    paths-ignore:
      - 'docs/**'
      - 'CLOUDFLARE_NEXT15_VALIDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-next15-opennext-build
  cancel-in-progress: true

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-next15-opennext-validation
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current locked dependencies
        run: npm ci

      - name: Confirm locked validation dependencies
        run: npm ls next react react-dom eslint-config-next @types/react @types/react-dom @opennextjs/cloudflare wrangler --depth=0

      - name: Run quality checks
        run: npm run quality

      - name: Build all Next.js routes
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/next-build.log"
        env:
          NEXT_PUBLIC_SITE_URL: https://sake-catalog-preview.invalid
          SITEMAP_PHASE: "1"
          SAKE_CATALOG_ENV: preview

      - name: Check generated static page count
        run: grep -qE 'Generating static pages \(2585/2585\)' "$RUNNER_TEMP/next-build.log"

      - name: Build Cloudflare Worker with OpenNext
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: https://sake-catalog-preview.invalid
          SITEMAP_PHASE: "1"
          SAKE_CATALOG_ENV: preview

      - name: Start local Worker preview and smoke test
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/wrangler-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8787/ -o "$RUNNER_TEMP/home.html"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/wrangler-preview.log"
            exit 1
          fi
          grep -qi 'sake select' "$RUNNER_TEMP/home.html"
          curl --silent --show-error --fail http://127.0.0.1:8787/search -o "$RUNNER_TEMP/search.html"
          grep -qi 'type="search"' "$RUNNER_TEMP/search.html"
          curl --silent --show-error --fail -D "$RUNNER_TEMP/search-index-headers.txt" http://127.0.0.1:8787/api/sakes/search-index -o "$RUNNER_TEMP/search-index.json"
          grep -qi 'cache-control:.*s-maxage=86400' "$RUNNER_TEMP/search-index-headers.txt"
          node -e "const d=require(process.argv[1]); if(!Array.isArray(d)||d.length!==997) process.exit(1); console.log('Search index items:', d.length)" "$RUNNER_TEMP/search-index.json"


      # This workflow is read-only: it validates the isolated branch and never
      # commits or pushes generated migration changes back to the repository.
